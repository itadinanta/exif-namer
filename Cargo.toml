[package]
name = "exif-namer"
version = "0.1.4"
edition = "2021"
keywords = ["exif", "copy", "move", "link", "rename"]
description = "Utility to bulk copy/link/rename image and other media file sets"
repository = "https://github.com/itadinanta/exif-namer"
license = "Apache-2.0"
publish = false # insurance against accidents

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# kamadak-exif = "0.6"
exif = { version = "0.5", path = "../exif-rs" }
glob = "0.3"
regex = "1.10"
log = "0.4"
log4rs = "1.3"
chrono = { version = "0.4", features = ["alloc", "std", "clock", "now"] }
digest-io = "0.1"
sha1 = "0.11"
hex = "0.4"
handlebars = { version="6.4", features = ["string_helpers"] }
handlebars_misc_helpers = { version = "0.17", features = ["string", "uuid", "regex"] }
serde_json = "1.0"
pathdiff = "0.2"
same-file = "1.0"
const_format = "0.2"
uuid = "1.10"
num = "0.4"
